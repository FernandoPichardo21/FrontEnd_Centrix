# Configuración del analizador Dart/Flutter para centrix_mobile
#
# Referencia: https://dart.dev/guides/language/analysis-options
# flutter_lints: https://pub.dev/packages/flutter_lints

include: package:flutter_lints/flutter.yaml

analyzer:
  # Tratar advertencias y errores según la severidad definida
  errors:
    # Errores que bloquean compilación → deben ser error
    missing_required_param: error
    missing_return: error
    dead_code: warning

    # Buenas prácticas elevadas a error en este proyecto
    always_declare_return_types: error
    unawaited_futures: error
    cancel_subscriptions: error

  exclude:
    - '**/*.g.dart'          # Código generado (build_runner)
    - '**/*.freezed.dart'    # Clases inmutables generadas

linter:
  rules:
    # ── Estilo y legibilidad ────────────────────────────────────────────────
    prefer_single_quotes: true           # Consistencia de comillas
    always_put_required_named_parameters_first: true
    sort_constructors_first: true
    sort_unnamed_constructors_first: true

    # ── Seguridad y robustez ────────────────────────────────────────────────
    avoid_print: true                    # Usar logger en producción
    avoid_dynamic_calls: true           # Sin .call() en dinámicos
    avoid_catches_without_on_clauses: true
    only_throw_errors: true

    # ── Rendimiento Flutter ─────────────────────────────────────────────────
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_build_context_synchronously: true  # Evitar contexto stale tras await

    # ── Nulabilidad y tipos ─────────────────────────────────────────────────
    cast_nullable_to_non_nullable: true
    null_check_on_nullable_type_parameter: true
    unnecessary_nullable_for_final_variable_declarations: true

    # ── Testing ─────────────────────────────────────────────────────────────
    always_declare_return_types: true
    prefer_const_constructors: true      # Optimiza árbol de widgets
    prefer_const_literals_to_create_immutables: true

    # ── Documentación ───────────────────────────────────────────────────────
    public_member_api_docs: false        # Opcional: activar cuando madure el proyecto
