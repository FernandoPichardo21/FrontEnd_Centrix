name: CI – Centrix Mobile

on:
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

# Cancela runs anteriores del mismo PR para ahorrar minutos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.0'   # Pin para builds reproducibles
  WORKING_DIR: centrix_mobile  # Sub-package Flutter real del repo

jobs:
  # ──────────────────────────────────────────────
  # JOB 1 ▸ LINTER + ANÁLISIS ESTÁTICO DE DART
  # ──────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # dart analyze = type-checking + linting (flutter_lints + reglas extra)
      - name: Ejecutar análisis estático (dart analyze)
        run: flutter analyze --fatal-infos --fatal-warnings
        # --fatal-infos  → infos también bloquean el pipeline
        # --fatal-warnings → advertencias bloquean el pipeline

      # dart format valida que el código siga el estilo Dart oficial
      - name: Verificar formato de código (dart format)
        run: dart format --output=none --set-exit-if-changed lib/ test/

  # ──────────────────────────────────────────────
  # JOB 2 ▸ PRUEBAS UNITARIAS Y DE WIDGET
  # ──────────────────────────────────────────────
  test:
    name: 🧪 Unit & Widget Tests
    runs-on: ubuntu-latest
    needs: lint                # Solo corre si el lint pasó
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Ejecutar pruebas con cobertura
        run: |
          flutter test \
            --coverage \
            --reporter=github \
            test/

      # Publica el reporte de cobertura como artefacto del workflow
      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.WORKING_DIR }}/coverage/lcov.info
          retention-days: 14

      # Comentario de cobertura en el PR (opcional pero útil)
      - name: Comentar cobertura en PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ${{ env.WORKING_DIR }}/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # JOB 3 ▸ BUILD DE VALIDACIÓN (Android)
  # ──────────────────────────────────────────────
  build-android:
    name: 🤖 Build Android (APK debug)
    runs-on: ubuntu-latest
    needs: test                # Solo corre si los tests pasaron
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17 (requerido por Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Construir APK de depuración
        run: flutter build apk --debug --no-pub

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ──────────────────────────────────────────────
  # JOB 4 ▸ BUILD DE VALIDACIÓN (iOS – solo en mac)
  # ──────────────────────────────────────────────
  build-ios:
    name: 🍎 Build iOS (sin firma)
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # --no-codesign evita necesitar certificados de Apple en CI
      - name: Construir iOS (sin firma de código)
        run: flutter build ios --debug --no-codesign --no-pub

  # ──────────────────────────────────────────────
  # JOB 5 ▸ RESUMEN FINAL
  # ──────────────────────────────────────────────
  ci-status:
    name: ✅ CI Status Gate
    runs-on: ubuntu-latest
    needs: [lint, test, build-android]
    if: always()
    steps:
      - name: Verificar estado global del pipeline
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.build-android.result }}" != "success" ]]; then
            echo "❌ Pipeline fallido. Revisa los jobs anteriores."
            exit 1
          fi
          echo "✅ Todos los checks pasaron correctamente."
